[package]
name = "egui-cjk-font"
version = "0.2.0"
edition = "2024"
description = "Cross-platform automatic CJK font loading for egui/eframe apps"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Keivry/egui-cjk-font"
homepage = "https://github.com/Keivry/egui-cjk-font"
keywords = ["egui", "font", "cjk", "chinese", "localization"]
categories = ["gui", "internationalization"]

[dependencies]
egui = "0.37"
font-kit = { version = "0.14", features = ["source-fontconfig-dlopen"] }
sys-locale = "0.3"
